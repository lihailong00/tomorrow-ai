# Install as /etc/nginx/conf.d/zz-tomorrow-provider-https.conf (http context).
# Replace every SERVER_NAME with the exact assigned provider hostname.
# Load after tomorrow.conf, which defines log_format tomorrow and the
# tomorrow_phone / tomorrow_phone_auth / tomorrow_phone_auth_global zones.
# Remove the temporary health probe.
#
# Valid only for the verified provider route that terminates trusted TLS,
# overwrites X-Forwarded-Proto, and forwards to this VM's TCP port 10014.
# These are the three observed ingress peers, not a presumed trusted subnet.
map $realip_remote_addr $tomorrow_provider_ingress_allowed {
    default 0;
    10.199.87.254 1;
    10.199.195.111 1;
    10.199.127.231 1;
}

server {
    listen 10014;
    server_name SERVER_NAME;
    server_tokens off;

    # Set at server scope so realip runs in POST_READ, before server rewrite
    # guards and limit_req. The verified ingress appends the actual client as
    # the last XFF address; client-provided X-Real-IP is NOT trustworthy.
    set_real_ip_from 10.199.87.254;
    set_real_ip_from 10.199.195.111;
    set_real_ip_from 10.199.127.231;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    access_log /var/log/nginx/tomorrow-provider-access.log tomorrow;
    # Standard nginx error logs can include the full request URI and query.
    # Use safe API/journald diagnostics and query-free access logs instead.
    error_log /dev/null crit;

    # Check the original TCP peer, not the client address rewritten by realip.
    # Return-only checks run before redirects and proxy access, preventing an
    # untrusted source from selecting HTTPS by forging a forwarded header.
    if ($tomorrow_provider_ingress_allowed = 0) {
        return 403;
    }
    if ($http_host = "") {
        return 421;
    }
    if ($host != SERVER_NAME) {
        return 421;
    }
    if ($http_x_forwarded_proto != "https") {
        return 308 https://SERVER_NAME$request_uri;
    }

    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host SERVER_NAME;
    proxy_set_header X-Forwarded-Host SERVER_NAME;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    # Forward only the verified client address. Never pass through or extend
    # the untrusted prefix of the original client-provided forwarding chain.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 125s;
    proxy_read_timeout 125s;
    proxy_buffering off;
    # API 429 responses already carry the shared JSON envelope and a dynamic
    # Retry-After. Preserve those; this handler is only for nginx rejections.
    proxy_intercept_errors off;
    limit_req_status 429;
    error_page 429 = @tomorrow_auth_rate_limited;

    # Phone verification remains the public mobile login policy.
    location = /v1/auth/register {
        return 404;
    }
    location = /v1/auth/login {
        return 404;
    }

    # Per verified client IP; provider peer changes cannot create new buckets.
    # Request buffering keeps oversized bodies out of the upstream API.
    location = /v1/auth/phone/code {
        client_max_body_size 2k;
        proxy_request_buffering on;
        limit_req zone=tomorrow_phone burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    # Register, password login and reset share both a per-client IP bucket and
    # a per-virtual-host bucket, bounding distributed password-hashing load.
    location = /v1/auth/phone/register {
        client_max_body_size 2k;
        proxy_request_buffering on;
        limit_req zone=tomorrow_phone_auth burst=5 nodelay;
        limit_req zone=tomorrow_phone_auth_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /v1/auth/phone/login {
        client_max_body_size 2k;
        proxy_request_buffering on;
        limit_req zone=tomorrow_phone_auth burst=5 nodelay;
        limit_req zone=tomorrow_phone_auth_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    location = /v1/auth/phone/password/reset {
        client_max_body_size 2k;
        proxy_request_buffering on;
        limit_req zone=tomorrow_phone_auth burst=5 nodelay;
        limit_req zone=tomorrow_phone_auth_global burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
    # Photo copies stream directly to the API; never spool request bodies to disk.
    location ~ ^/v1/photo-index/devices/[a-fA-F0-9-]+/assets/[a-fA-F0-9-]+/analyze$ {
        client_max_body_size 4112k;
        client_body_buffer_size 4112k;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8080;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /ai-import {
        proxy_pass http://127.0.0.1:8080;
    }

    location = /internal {
        return 404;
    }
    location /internal/ {
        return 404;
    }
    location / {
        return 404;
    }

    location @tomorrow_auth_rate_limited {
        internal;
        default_type application/json;
        # Defining any local add_header disables inherited add_header values
        # on the deployed nginx version, so repeat both security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many authentication requests. Please retry later."}}';
    }
}
