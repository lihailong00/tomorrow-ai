# Install as /etc/nginx/conf.d/tomorrow.conf (http context).
# Replace SERVER_NAME before installing. TLS must terminate at a trusted HTTPS
# ingress or in an additional certificate-backed 443 server on this host.
# Log the path without query arguments; OAuth codes must not enter access logs.
log_format tomorrow '$remote_addr - [$time_local] '
                    '"$request_method $uri $server_protocol" $status '
                    '$body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=tomorrow_phone:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=tomorrow_phone_auth:1m rate=10r/m;
limit_req_zone $server_name zone=tomorrow_phone_auth_global:1m rate=30r/m;

server {
    listen 80;
    server_name SERVER_NAME;
    server_tokens off;
    access_log /var/log/nginx/tomorrow-access.log tomorrow;
    error_log /var/log/nginx/tomorrow-error.log warn;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_send_timeout 125s;
    proxy_read_timeout 1350s;
    proxy_buffering off;

    # Cloud mobile authentication uses verified phone numbers. Keep the legacy
    # email/password endpoints available only on the private loopback API.
    location = /v1/auth/register {
        return 404;
    }
    location = /v1/auth/login {
        return 404;
    }

    # This direct HTTP listener is not a trusted TLS terminator. Keep every
    # phone credential/code route closed here, including password recovery;
    # use nginx-provider-https.conf for the verified provider HTTPS ingress.
    location = /v1/auth/phone/code {
        client_max_body_size 2k;
        return 503;
    }
    location = /v1/auth/phone/register {
        client_max_body_size 2k;
        return 503;
    }
    location = /v1/auth/phone/login {
        client_max_body_size 2k;
        return 503;
    }
    location = /v1/auth/phone/password/reset {
        client_max_body_size 2k;
        return 503;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Includes /internal/agent/*, root, data paths and Pi. No static file serving.
    location / {
        return 404;
    }
}
