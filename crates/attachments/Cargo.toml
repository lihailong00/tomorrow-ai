[package]
name = "tomorrow-attachments"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
s3 = ["dep:aws-sdk-s3", "dep:aws-credential-types", "dep:aws-runtime", "dep:aws-sigv4", "dep:aws-smithy-async", "dep:aws-smithy-http-client", "dep:aws-smithy-runtime", "dep:aws-smithy-runtime-api", "dep:aws-smithy-runtime-api-macros", "dep:aws-smithy-types", "dep:aws-types"]

[dependencies]
aws-sdk-s3 = { version = "=1.137.0", optional = true, default-features = false, features = ["rt-tokio", "rustls", "default-https-client", "http-1x", "behavior-version-latest"] }
# Exact AWS family constraints preserve the workspace's Rust 1.92 toolchain even
# if a future dependency resolution occurs without Cargo's MSRV fallback mode.
aws-credential-types = { version = "=1.2.14", optional = true }
aws-runtime = { version = "=1.7.5", optional = true }
aws-sigv4 = { version = "=1.4.5", optional = true }
aws-smithy-async = { version = "=1.2.14", optional = true }
aws-smithy-http-client = { version = "=1.1.13", optional = true }
aws-smithy-runtime = { version = "=1.11.3", optional = true }
aws-smithy-runtime-api = { version = "=1.12.3", optional = true }
aws-smithy-runtime-api-macros = { version = "=1.0.0", optional = true }
aws-smithy-types = { version = "=1.5.0", optional = true }
aws-types = { version = "=1.3.16", optional = true }
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
futures-util.workspace = true
quick-xml = "0.42"
reqwest.workspace = true
regex = "1"
sha2 = "0.10"
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tomorrow-domain = { path = "../domain" }

[dev-dependencies]
tower.workspace = true
