[package]
name = "tomorrow-connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
hmac = "0.12"
mailparse = "0.18"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
axum.workspace = true
base64 = "0.22"
chrono.workspace = true
futures-util.workspace = true
rand = "0.8"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tomorrow-domain = { path = "../domain" }
tomorrow-attachments = { path = "../attachments" }
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower.workspace = true
