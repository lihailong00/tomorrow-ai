[package]
name = "tomorrow-api"
version = "0.1.0"
edition = "2021"
default-run = "tomorrow-api"

[features]
default = []
s3 = ["tomorrow-attachments/s3"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
tomorrow-domain = { path = "../domain" }
tomorrow-attachments = { path = "../attachments" }
tomorrow-connectors = { path = "../connectors" }
tomorrow-settings = { path = "../settings" }
sqlx.workspace = true
uuid.workspace = true
futures-util.workspace = true
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
tower.workspace = true
tempfile = "3"
